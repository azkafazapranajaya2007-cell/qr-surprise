<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Message for You</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #ffeef0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden; 
      position: relative;
      transition: background-color 2s ease;
    }

    /* --- Night Sky Stars --- */
    .star {
      position: absolute;
      background-color: white;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      animation: twinkle 2s infinite alternate ease-in-out;
      transition: opacity 2s ease;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* --- Entrance Fly-in Animation for Envelope --- */
    @keyframes flyInCenter {
      0% {
        transform: translateY(-100vh) scale(0.3) rotate(-15deg);
        opacity: 0;
      }
      70% {
        transform: translateY(10px) scale(1.05) rotate(2deg);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .envelope-wrapper {
      position: relative;
      width: 320px;
      height: 220px;
      background-color: #ff758f;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 10;
      animation: flyInCenter 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: transform 0.4s ease, opacity 0.8s ease;
    }

    .envelope-wrapper:hover {
      transform: scale(1.03);
    }

    .envelope-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 120px solid #ff4d6d;
      transform-origin: top;
      transition: transform 0.6s ease-in-out;
      z-index: 12;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid #ff5c7a;
      border-right: 160px solid #ff5c7a;
      border-bottom: 110px solid #ff4d6d;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 11;
    }

    .envelope-seal {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      width: 45px;
      height: 45px;
      background-color: #e63946;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 13;
      transition: opacity 0.4s ease;
    }

    .envelope-hint {
      position: absolute;
      bottom: -40px;
      width: 100%;
      text-align: center;
      color: #ff4d6d;
      font-weight: 600;
      font-size: 0.95rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-5px); }
    }

    .envelope-wrapper.open::before {
      transform: rotateX(180deg);
      z-index: 9;
    }

    /* --- Card Style --- */
    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 88%;
      position: absolute;
      z-index: 15;
      opacity: 0;
      transform: translateY(50px) scale(0.9);
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
    }

    .card.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    h1 { color: #ff4d6d; margin-bottom: 15px; font-size: 1.6rem; }
    p { 
      font-size: 1.05rem; 
      color: #555; 
      line-height: 1.6; 
      min-height: 70px;
      margin-bottom: 20px;
    }

    /* Candle Style */
    .candle-container {
      margin: 15px auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .candle {
      width: 34px;
      height: 80px;
      background: linear-gradient(to bottom, #ff9ebb, #ff4d6d);
      border-radius: 8px 8px 4px 4px;
      position: relative;
      box-shadow: inset -4px 0 6px rgba(0,0,0,0.15);
    }

    .wick {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 10px;
      background-color: #555;
      border-radius: 2px;
    }

    .flame {
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 26px;
      background: radial-gradient(ellipse at bottom, #ffee55 0%, #ff9900 60%, #ff3300 100%);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 15px #ff9900, 0 0 25px #ffee55;
      animation: flicker 0.1s infinite alternate;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-1deg); }
      100% { transform: translateX(-50%) scale(1.08) rotate(1deg); }
    }

    .flame.off {
      opacity: 0;
      transform: translateX(-50%) scale(0);
    }

    .candle-hint {
      font-size: 0.85rem;
      color: #ff4d6d;
      margin-top: 10px;
      font-weight: 600;
      background: #fff0f3;
      padding: 6px 14px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      background-color: #ff4d6d;
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* --- Action Choices Container --- */
    .action-container {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-choice {
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn-hug { background-color: #ff4d6d; color: white; }
    .btn-hug:hover { background-color: #ff2a55; transform: scale(1.03); }

    .btn-destroy { background-color: #6c757d; color: white; }
    .btn-destroy:hover { background-color: #495057; transform: scale(1.03); }

    .btn-burn { background-color: #343a40; color: white; }
    .btn-burn:hover { background-color: #212529; transform: scale(1.03); }

    /* Final Response Box */
    .final-response {
      display: none;
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4d6d;
      animation: fadeIn 0.8s ease forwards;
    }

    .btn-audio {
      background-color: #fff0f3;
      color: #ff4d6d;
      border: 1px solid #ff4d6d;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: none;
      margin: 15px auto 0;
    }
    .btn-audio:hover { background-color: #ff4d6d; color: white; }

    /* Floating Hearts */
    .heart {
      position: absolute;
      color: #ff758f;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      animation: floatUp 5s linear forwards;
      opacity: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .click-heart {
      position: absolute;
      font-size: 22px;
      pointer-events: none;
      z-index: 999;
      animation: clickPop 0.8s ease-out forwards;
      transform: translate(-50%, -50%);
    }

    @keyframes clickPop {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      50% { opacity: 1; transform: translate(-50%, -80px) scale(1.3); }
      100% { opacity: 0; transform: translate(-50%, -120px) scale(1); }
    }

    .easter-egg-trigger {
      cursor: pointer;
      user-select: none;
    }

    /* Modal Easter Egg */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: white; padding: 25px; border-radius: 18px;
      max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transform: scale(0.8); transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-box h2 { color: #ff4d6d; margin-top: 0; font-size: 1.4rem; }
    .modal-box p { font-size: 0.95rem; color: #444; min-height: auto; margin-bottom: 20px; }
    
    .btn-main {
      background-color: #ff4d6d; color: white; border: none;
      padding: 10px 24px; font-size: 0.95rem; font-weight: 600;
      border-radius: 20px; cursor: pointer;
    }

    /* --- ANIMATIONS FOR THE 3 CHOICES --- */
    /* 1. Menyayangi (Hug) */
    .card-hug {
      animation: hugAnim 1.5s ease-in-out infinite alternate;
      box-shadow: 0 0 30px #ff758f !important;
    }
    @keyframes hugAnim {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* 2. Melampiaskan (Destroy) */
    .card-destroy {
      animation: destroyAnim 0.6s ease forwards;
    }
    @keyframes destroyAnim {
      0% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(0.9) rotate(-15deg) skewX(10deg); }
      40% { transform: scale(0.7) rotate(20deg) skewY(-15deg); }
      60% { transform: scale(0.5) rotate(-30deg) translate(-20px, 50px); }
      80% { transform: scale(0.3) rotate(45deg) translate(50px, 100px); opacity: 0.5; }
      100% { transform: scale(0.1) rotate(90deg) translate(200px, 300px); opacity: 0; filter: blur(5px); }
    }

    /* 3. Merelakan (Burn to Ash) */
    .card-burn {
      animation: burnAnim 2s ease forwards;
    }
    @keyframes burnAnim {
      0% { filter: brightness(1) sepia(0); }
      30% { filter: brightness(1.2) sepia(0.8) hue-rotate(-30deg); box-shadow: 0 0 40px #ff4500; }
      70% { filter: brightness(0.3) contrast(2) grayscale(0.8); opacity: 0.6; }
      100% { filter: brightness(0) grayscale(1); opacity: 0; transform: translateY(-30px) scale(0.8); }
    }
  </style>
</head>
<body>

  <!-- Audio Elements -->
  <audio id="bg-music" src="music.mp3" loop></audio>
  <audio id="sfx-click" src="click.mp3" preload="auto"></audio>
  <audio id="sfx-kiss" src="kiss.mp3" preload="auto"></audio>

  <!-- 1. Interactive Envelope -->
  <div id="envelope" class="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope-pocket"></div>
    <div id="seal" class="envelope-seal">💌</div>
    <div id="envelope-hint" class="envelope-hint">Klik amplop untuk membuka ✉️</div>
  </div>

  <!-- 2. Main Card -->
  <div id="main-card" class="card">
    <h1 id="card-title">❤️ Special Message For You ❤️</h1>
    
    <!-- Candle Stage -->
    <div id="candle-section" class="candle-container" onclick="blowCandle()">
      <div class="candle">
        <div class="wick"></div>
        <div id="flame" class="flame"></div>
      </div>
      <div id="candle-hint" class="candle-hint">🕯️ Tiup/Klik lilin untuk Make a Wish!</div>
    </div>

    <!-- Message Container -->
    <p><span id="text-container"></span><span id="cursor" class="cursor" style="display:none;">&nbsp;</span></p>
    
    <!-- 3 Action Choices -->
    <div id="action-container" class="action-container">
      <button class="btn-choice btn-hug" onclick="handleChoice('Menyayangi')">🤗 Menyayangi (Peluk Erat)</button>
      <button class="btn-choice btn-destroy" onclick="handleChoice('Melampiaskan')">💥 Melampiaskan (Hancurkan)</button>
      <button class="btn-choice btn-burn" onclick="handleChoice('Merelakan')">🔥 Merelakan (Bakar ABU)</button>
    </div>

    <!-- Final Response Text Placeholder -->
    <div id="final-response" class="final-response"></div>

    <button id="btn-audio" class="btn-audio" onclick="toggleAudio()">🔊 Musik: ON</button>
  </div>

  <!-- 3. Easter Egg Modal -->
  <div id="easter-egg-modal" class="modal-overlay">
    <div class="modal-box">
      <h2>✨ Secret Message! ✨</h2>
      <p>Kamu nemuin pesan rahasia ini! Makasih ya udah selalu ada dan jadi alasan buat tersenyum. You really mean a lot to me! 🤫💖</p>
      <button class="btn-main" onclick="closeSecret()">Tutup</button>
    </div>
  </div>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1537708815074594816/0JjqpICIf5LfciOKCZsTzODoYR6bW18FChLA9mekkl6vTxadb6qDOxDzt_lfNhOGKTkq";
    const messagePart1 = "Halo! Makasih ya karena udah berusaha hingga sejauh ini. I'm so proud of youuuuuuuuu ";
    
    let index = 0;
    const music = document.getElementById('bg-music');
    const sfxClick = document.getElementById('sfx-click');
    const sfxKiss = document.getElementById('sfx-kiss');
    
    const textContainer = document.getElementById('text-container');
    const cursor = document.getElementById('cursor');
    const btnAudio = document.getElementById('btn-audio');
    const envelope = document.getElementById('envelope');
    const mainCard = document.getElementById('main-card');
    const flame = document.getElementById('flame');
    const candleHint = document.getElementById('candle-hint');
    const actionContainer = document.getElementById('action-container');
    const finalResponse = document.getElementById('final-response');
    
    let isSurpriseStarted = false;
    let isCandleBlown = false;
    let heartInterval;
    let clickCount = 0;

    // Play helper with error fallback
    function playAudio(audioElem) {
      if (audioElem) {
        audioElem.currentTime = 0;
        audioElem.play().catch(err => console.log("Audio play deferred:", err));
      }
    }

    // --- Langkah 1: Buka Amplop ---
    function openEnvelope() {
      if (envelope.classList.contains('open')) return;

      playAudio(sfxClick);
      envelope.classList.add('open');
      document.getElementById('seal').style.opacity = '0';
      document.getElementById('envelope-hint').style.display = 'none';

      document.body.style.backgroundColor = "#0d1b2a";
      createStars();
      music.play().catch(err => console.log("Autoplay dicegah browser:", err));

      setTimeout(() => {
        envelope.style.opacity = '0';
        setTimeout(() => {
          envelope.style.display = 'none';
          mainCard.classList.add('active');
          btnAudio.style.display = 'inline-block';
        }, 500);
      }, 800);
    }

    // --- Langkah 2: Tiup Lilin ---
    function blowCandle() {
      if (isCandleBlown) return;
      isCandleBlown = true;

      flame.classList.add('off');
      candleHint.innerHTML = "✨ Wish Granted! ✨";
      candleHint.style.background = "#e8f5e9";
      candleHint.style.color = "#2e7d32";

      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      isSurpriseStarted = true;
      cursor.style.display = 'inline-block';
      setTimeout(typeWriter, 800);
      startHearts();
    }

    // --- Langkah 3: Animasi Ketik Teks ---
    function typeWriter() {
      if (index < messagePart1.length) {
        textContainer.innerHTML += messagePart1.charAt(index);
        index++;
        setTimeout(typeWriter, 50);
      } else {
        const eggSpan = document.createElement('span');
        eggSpan.className = 'easter-egg-trigger';
        eggSpan.innerHTML = "❤️❤️❤️";
        eggSpan.onclick = triggerEasterEgg;
        textContainer.appendChild(eggSpan);

        setTimeout(() => cursor.style.display = 'none', 1000);

        // Tampilkan 3 Opsi Pilihan
        actionContainer.style.display = 'flex';
      }
    }

    // --- Langkah 4: Handling 3 Pilihan ---
    function handleChoice(option) {
      playAudio(sfxClick);
      actionContainer.style.display = 'none';
      
      let responseText = "";
      let payloadContent = "";

      if (option === 'Menyayangi') {
        responseText = "I LOVE YOU SO MUCHHHHHHH!!! ❤️✨";
        payloadContent = "💖 **Pengguna Memilih:** MENYAYANGI (Surat Dipeluk Erat)\n💬 **Respon:** *I LOVE YOU SO MUCHHHHHHH!!!*";
        
        mainCard.classList.add('card-hug');
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
        
      } else if (option === 'Melampiaskan') {
        responseText = "I HATE YOU!!! 💔";
        payloadContent = "💥 **Pengguna Memilih:** MELAMPIASKAN (Surat Dihancurkan)\n💬 **Respon:** *I HATE YOU!!!*";
        
        mainCard.classList.add('card-destroy');
        document.body.style.backgroundColor = "#2b090a";
        
      } else if (option === 'Merelakan') {
        responseText = "I miss you... 🕯️";
        payloadContent = "🔥 **Pengguna Memilih:** MERELAKAN (Surat Dibakar Menjadi Abu)\n💬 **Respon:** *I miss you...*";
        
        mainCard.classList.add('card-burn');
        document.body.style.backgroundColor = "#050505";
      }

      // Tampilkan Pesan Balasan di Layar
      setTimeout(() => {
        if(option === 'Melampiaskan' || option === 'Merelakan') {
          mainCard.style.display = 'none';
          
          // Tampilkan pesan akhir di tengah layar jika kartu hilang/hancur
          const endText = document.createElement('div');
          endText.style.color = 'white';
          endText.style.fontSize = '1.8rem';
          endText.style.fontWeight = 'bold';
          endText.style.textAlign = 'center';
          endText.style.zIndex = '100';
          endText.style.animation = 'fadeIn 1.5s ease forwards';
          endText.innerText = responseText;
          document.body.appendChild(endText);
        } else {
          finalResponse.innerText = responseText;
          finalResponse.style.display = 'block';
        }
      }, option === 'Menyayangi' ? 100 : 1200);

      // Kirim Data ke Discord Webhook
      sendToDiscord(payloadContent);
    }

    // --- Discord Webhook Integration ---
    function sendToDiscord(content) {
      if(!DISCORD_WEBHOOK_URL) return;

      const payload = {
        username: "QR-Surprise Bot",
        avatar_url: "https://cdn-icons-png.flaticon.com/512/2278/2278992.png",
        embeds: [{
          title: "💌 Tanggapan Baru Diterima!",
          description: content,
          color: 16731245,
          timestamp: new Date().toISOString()
        }]
      };

      fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => console.error("Gagal mengirim ke Discord:", err));
    }

    // --- Interactive Hearts Effect ---
    document.addEventListener('click', function(e) {
      if(e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('.modal-box')) return;

      const clickHeart = document.createElement('div');
      clickHeart.className = 'click-heart';
      clickHeart.innerHTML = '💖';
      clickHeart.style.left = e.clientX + 'px';
      clickHeart.style.top = e.clientY + 'px';
      
      document.body.appendChild(clickHeart);
      setTimeout(() => clickHeart.remove(), 800);
    });

    // --- Stars Background ---
    function createStars() {
      for (let i = 0; i < 45; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1 + 'px';
        star.style.width = size;
        star.style.height = size;
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(star);

        setTimeout(() => star.style.opacity = '1', 100);
      }
    }

    // --- Easter Egg (3x Love Click) ---
    function triggerEasterEgg() {
      clickCount++;
      if (clickCount >= 3) {
        playAudio(sfxKiss);
        document.getElementById('easter-egg-modal').classList.add('active');
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.5 } });
        clickCount = 0;
      }
    }

    function closeSecret() {
      document.getElementById('easter-egg-modal').classList.remove('active');
    }

    // --- Toggle Audio ---
    function toggleAudio() {
      if (music.paused) {
        music.play();
        btnAudio.innerHTML = "🔊 Musik: ON";
      } else {
        music.pause();
        btnAudio.innerHTML = "🔇 Musik: OFF";
      }
    }

    // --- Floating Hearts Background ---
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      
      const size = Math.random() * 20 + 10 + 'px';
      heart.style.fontSize = size;
      
      const duration = Math.random() * 4 + 3 + 's';
      heart.style.animationDuration = duration;

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), parseFloat(duration) * 1000);
    }

    function startHearts() {
      heartInterval = setInterval(createHeart, 300);
    }

    // --- Visibility Manager ---
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        music.pause();
        clearInterval(heartInterval);
      } else {
        if (isSurpriseStarted && btnAudio.innerHTML.includes("ON")) {
          music.play().catch(err => console.log(err));
        }
        if (isSurpriseStarted) {
          startHearts();
        }
      }
    });
  </script>
</body>
</html>
