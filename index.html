<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Message for You</title>
  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fce4ec;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      transition: background-color 1.5s ease;
      position: relative;
    }

    /* --- Stars Background --- */
    #stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* --- Audio Toggle Button --- */
    #btn-audio {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: none;
      transition: all 0.3s;
    }

    #btn-audio:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* --- Envelope Wrapper --- */
    .envelope-wrapper {
      position: relative;
      width: 300px;
      height: 200px;
      background-color: #f48fb1;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 10;
      transition: transform 0.3s ease, opacity 0.8s ease;
    }

    .envelope-wrapper:hover {
      transform: translateY(-5px);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 110px solid #f06292;
      transform-origin: top;
      transition: transform 0.6s ease 0.2s, z-index 0.2s ease 0.2s;
      z-index: 3;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid #f48fb1;
      border-right: 150px solid #f48fb1;
      border-bottom: 100px solid #ec407a;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      z-index: 2;
    }

    .envelope-seal {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      background: #d81b60;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 4;
      transition: opacity 0.4s;
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .hint-text {
      position: absolute;
      bottom: -40px;
      width: 100%;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* --- Interactive Card --- */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
      opacity: 0;
      transform: scale(0.8) translateY(30px);
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: absolute;
      z-index: 20;
    }

    .card.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    .card h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.3rem;
      color: #d81b60;
      margin-bottom: 15px;
    }

    /* Candle Animation */
    .candle-container {
      margin: 15px auto;
      width: 40px;
      height: 60px;
      position: relative;
      cursor: pointer;
    }

    .candle-body {
      width: 24px;
      height: 45px;
      background: linear-gradient(to bottom, #ff80ab, #f50057);
      border-radius: 4px;
      position: absolute;
      bottom: 0;
      left: 8px;
    }

    .flame {
      width: 12px;
      height: 20px;
      background: #ff9800;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -2px;
      left: 14px;
      box-shadow: 0 0 12px #ff9800;
      animation: flicker 0.1s infinite alternate;
      transition: opacity 0.5s ease;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); opacity: 0.8; }
    }

    .flame.out {
      opacity: 0;
    }

    .message-text {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.6;
      min-height: 80px;
      margin: 15px 0;
    }

    /* Action Buttons */
    .action-buttons {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .action-buttons.show {
      display: flex;
      opacity: 1;
    }

    .btn-choice {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-choice:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .btn-1 { background-color: #f8bbd0; color: #880e4f; }
    .btn-2 { background-color: #e1bee7; color: #4a148c; }
    .btn-3 { background-color: #cfd8dc; color: #263238; }

    /* Modal / Easter Egg */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .interactive-heart {
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      transition: transform 0.2s;
    }

    .interactive-heart:active {
      transform: scale(1.3);
    }

    /* Particle Heart on Click */
    .click-heart {
      position: fixed;
      pointer-events: none;
      color: #ff4081;
      font-size: 1.2rem;
      animation: floatUp 1s forwards ease-out;
      z-index: 300;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
    }
  </style>
</head>
<body>

  <div id="stars-container"></div>

  <!-- Main Background Music -->
  <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <button id="btn-audio" onclick="toggleMusic()">🔊 Musik: ON</button>

  <!-- Envelope Component -->
  <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
    <div class="envelope-flap"></div>
    <div class="envelope-pocket"></div>
    <div class="envelope-seal" id="seal">❤️</div>
    <div class="hint-text" id="envelope-hint">Klik amplop untuk membuka</div>
  </div>

  <!-- Interactive Card Component -->
  <div class="card" id="main-card">
    <h1>Special Message For You <span class="interactive-heart" onclick="triggerEasterEgg()">❤️</span></h1>
    
    <div class="candle-container" onclick="extinguishCandle()">
      <div class="flame" id="candle-flame"></div>
      <div class="candle-body"></div>
    </div>
    <p style="font-size: 0.75rem; color: #888;" id="candle-hint">Klik/tiup lilinnya dulu yuk!</p>

    <div class="message-text" id="typed-message"></div>

    <div class="action-buttons" id="action-buttons">
      <button class="btn-choice btn-1" onclick="handleChoice('Menyayangi')">Menyayangi</button>
      <button class="btn-choice btn-2" onclick="handleChoice('Melampiaskan')">Melampiaskan</button>
      <button class="btn-choice btn-3" onclick="handleChoice('Merelakan')">Merelakan</button>
    </div>
  </div>

  <!-- Easter Egg Modal -->
  <div class="modal" id="easter-egg-modal">
    <div class="modal-content">
      <h3>Pesan Rahasia! 💋</h3>
      <p style="margin: 10px 0; font-size: 0.9rem; color: #555;">
        Terima kasih sudah membuka pesan ini sampai akhir. Kamu selalu berharga!
      </p>
      <button class="btn-choice btn-1" style="width:100%; margin-top:10px;" onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const mainCard = document.getElementById('main-card');
    const music = document.getElementById('bg-music');
    const btnAudio = document.getElementById('btn-audio');
    const flame = document.getElementById('candle-flame');
    const typedMessage = document.getElementById('typed-message');
    const actionContainer = document.getElementById('action-buttons');

    let isCandleOut = false;
    let clickCount = 0;
    const fullText = "Setiap langkah dan momen membawa cerita tersendiri. Terima kasih sudah menjadi bagian dari perjalanan ini. Apapun pilihanmu ke depan, semoga kebahagiaan selalu menyertaimu.";

    // WEBHOOK DISCORD URL
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1392817028485255280/lG2HBy7S_9Ld8m57_E_m-2U9a3jCllc435aRrt1m3T1f4U-q6XwK40mC3n7gK4S1nS5v";

    // Helper audio instan khusus SFX
    function playSFX(filename) {
      const sfx = new Audio(filename);
      sfx.volume = 1.0;
      sfx.play().catch(err => console.log("SFX play blocked or deferred:", err));
    }

    // Fungsi Buka Amplop
    function openEnvelope() {
      if (envelope.classList.contains('open')) return;

      playSFX('click.mp3');
      envelope.classList.add('open');
      document.getElementById('seal').style.opacity = '0';
      document.getElementById('envelope-hint').style.display = 'none';

      document.body.style.backgroundColor = "#0d1b2a";
      createStars();
      music.play().catch(err => console.log("Autoplay dicegah browser:", err));

      setTimeout(() => {
        envelope.style.opacity = '0';
        setTimeout(() => {
          envelope.style.display = 'none';
          mainCard.classList.add('active');
          btnAudio.style.display = 'inline-block';
        }, 500);
      }, 800);
    }

    // Toggle Play/Pause Musik Utama
    function toggleMusic() {
      if (music.paused) {
        music.play();
        btnAudio.innerText = "🔊 Musik: ON";
      } else {
        music.pause();
        btnAudio.innerText = "🔇 Musik: OFF";
      }
    }

    // Matikan Lilin & Mulai Pengetikan Pesan Otomatis
    function extinguishCandle() {
      if (isCandleOut) return;
      isCandleOut = true;
      flame.classList.add('out');
      document.getElementById('candle-hint').innerText = "✨ Request terkirim ke langit...";

      playSFX('click.mp3');
      confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });

      setTimeout(typeWriter, 500);
    }

    // Efek Typing Teks
    let charIndex = 0;
    function typeWriter() {
      if (charIndex < fullText.length) {
        typedMessage.innerHTML += fullText.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, 40);
      } else {
        actionContainer.classList.add('show');
      }
    }

    // Fungsi Opsi Pilihan (Kirim ke Discord Embed Webhook)
    function handleChoice(option) {
      playSFX('click.mp3');
      actionContainer.style.display = 'none';

      typedMessage.innerHTML = `<em>Pilihanmu (${option}) telah tersampaikan. Terima kasih... ❤️</em>`;

      // Kirim Embed ke Discord
      fetch(DISCORD_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          embeds: [{
            title: "💌 Respon Baru dari Web Surpres",
            description: `Penerima memilih opsi: **${option}**`,
            color: option === 'Menyayangi' ? 0xff4081 : (option === 'Melampiaskan' ? 0xab47bc : 0x78909c),
            timestamp: new Date().toISOString(),
            footer: { text: "QR-Surprise Interactive Card" }
          }]
        })
      }).catch(err => console.log("Webhook error:", err));

      confetti({ particleCount: 120, spread: 100, origin: { y: 0.6 } });
    }

    // Fungsi Easter Egg
    function triggerEasterEgg() {
      clickCount++;
      if (clickCount >= 3) {
        playSFX('kiss.mp3');
        document.getElementById('easter-egg-modal').classList.add('active');
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.5 } });
        clickCount = 0;
      }
    }

    function closeModal() {
      document.getElementById('easter-egg-modal').classList.remove('active');
    }

    // Latar Bintang Malam
    function createStars() {
      const container = document.getElementById('stars-container');
      for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.animationDuration = `${Math.random() * 3 + 2}s`;
        container.appendChild(star);
      }
    }

    // Heart Particle saat Layar Di-klik
    document.addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.classList.contains('envelope-wrapper')) return;
      
      const heart = document.createElement('div');
      heart.className = 'click-heart';
      heart.innerHTML = '❤️';
      heart.style.left = `${e.clientX - 10}px`;
      heart.style.top = `${e.clientY - 10}px`;
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 1000);
    });

    // Pause Musik jika Pindah Tab Browser
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        music.pause();
      } else if (envelope.classList.contains('open')) {
        music.play().catch(err => console.log(err));
      }
    });
  </script>
</body>
</html>
