<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Message for You</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0d1b2a;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: background-color 1.2s ease;
      position: relative;
      perspective: 1000px;
    }

    /* --- ANIMASI KARTU JOKER --- */
    .joker-card {
      position: absolute;
      width: 220px;
      height: 320px;
      background: linear-gradient(135deg, #111, #222);
      border: 3px solid #ff0055;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      z-index: 50;
      cursor: pointer;
      transform-style: preserve-3d;
      animation: throwJoker 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .joker-card .joker-icon {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: pulseJoker 1s infinite alternate;
    }

    @keyframes pulseJoker {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    @keyframes throwJoker {
      0% {
        transform: translateZ(-1000px) translateY(-500px) rotate(-720deg) scale(0.1);
        opacity: 0;
      }
      70% {
        transform: translateZ(100px) translateY(0) rotate(10deg) scale(1.1);
        opacity: 1;
      }
      100% {
        transform: translateZ(0) translateY(0) rotate(0deg) scale(1);
        opacity: 1;
      }
    }

    .joker-card.morph-to-envelope {
      animation: flipAndMorph 1s forwards ease-in-out;
    }

    @keyframes flipAndMorph {
      0% { transform: rotateY(0deg) scale(1); opacity: 1; }
      50% { transform: rotateY(90deg) scale(0.8); opacity: 0.5; }
      100% { transform: rotateY(180deg) scale(0); opacity: 0; }
    }

    /* --- STYLING AMPLOP --- */
    .envelope-wrapper {
      position: relative;
      width: 300px;
      height: 200px;
      background-color: #f48fb1;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transform: scale(0.5);
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease;
      display: none;
    }

    .envelope-wrapper.show-envelope {
      display: block;
      animation: appearEnvelope 0.8s ease forwards;
    }

    @keyframes appearEnvelope {
      0% { opacity: 0; transform: scale(0.5) rotateX(-90deg); }
      100% { opacity: 1; transform: scale(1) rotateX(0deg); }
    }

    .envelope-flap {
      position: absolute; top: 0; left: 0;
      border-left: 150px solid transparent; border-right: 150px solid transparent;
      border-top: 110px solid #f06292; transform-origin: top;
      transition: transform 0.6s ease 0.2s, z-index 0.2s ease 0.2s; z-index: 3;
    }
    .envelope-pocket {
      position: absolute; bottom: 0; left: 0; width: 0; height: 0;
      border-left: 150px solid #f48fb1; border-right: 150px solid #f48fb1;
      border-bottom: 100px solid #ec407a; border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px; z-index: 2;
    }
    .envelope-seal {
      position: absolute; top: 90px; left: 50%; transform: translate(-50%, -50%);
      width: 45px; height: 45px; background: #d81b60; border-radius: 50%;
      display: flex; justify-content: center; align-items: center; color: white;
      font-size: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 4; transition: opacity 0.4s;
    }
    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg); z-index: 1;
    }
    .hint-text {
      position: absolute; bottom: -40px; width: 100%; text-align: center;
      color: #fff; font-size: 0.9rem; animation: pulse 1.5s infinite; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* --- KARTU UTAMA (LETTER) --- */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      width: 90%; max-width: 420px; padding: 35px 25px; border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center;
      opacity: 0; 
      transform: scale(0.8) translateY(30px); 
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.8s ease;
      position: absolute; z-index: 20;
    }
    .card.active {
      opacity: 1; transform: scale(1) translateY(0); pointer-events: auto;
    }
    .card h1 {
      font-family: 'Dancing Script', cursive; font-size: 2.3rem; color: #d81b60; margin-bottom: 15px;
    }

    /* --- VARIASI ANIMASI & TEMA SESUAI PERINTAH --- */

    /* 1. MENYAYANGI: Tema Gelap Kemerahan + Heartbeat Pulse */
    body.theme-love {
      background-color: #2b0a1a !important;
    }
    .card.anim-love {
      animation: heartbeatPulse 1.1s infinite cubic-bezier(0.215, 0.61, 0.355, 1) !important;
      border: 3px solid #ff4081 !important;
      box-shadow: 0 0 40px rgba(255, 64, 129, 0.8) !important;
    }
    @keyframes heartbeatPulse {
      0% { transform: scale(1); }
      14% { transform: scale(1.06); }
      28% { transform: scale(1); }
      42% { transform: scale(1.08); }
      70% { transform: scale(1); }
    }

    /* 2. MELAMPIASKAN: Tema Merah Gelap + Rage Shake + Retak + Meledak Berkeping-keping */
    body.theme-rage {
      background-color: #1a0000 !important;
    }
    .card.anim-rage {
      animation: rageShake 0.08s infinite !important;
      border: 3px solid #ff1744 !important;
      box-shadow: 0 0 50px rgba(255, 23, 68, 0.9) !important;
    }
    .card.damaged-card {
      background: repeating-linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.95),
        rgba(255, 255, 255, 0.95) 10px,
        rgba(200, 0, 0, 0.25) 10px,
        rgba(200, 0, 0, 0.25) 13px
      ) !important;
      filter: contrast(130%) drop-shadow(0 0 12px rgba(255,0,0,0.6));
    }
    @keyframes rageShake {
      0% { transform: translate(4px, 4px) rotate(0deg); }
      20% { transform: translate(-5px, -3px) rotate(1.5deg); }
      40% { transform: translate(3px, -4px) rotate(-1.5deg); }
      60% { transform: translate(-4px, 4px) rotate(0deg); }
      80% { transform: translate(5px, 3px) rotate(1.5deg); }
      100% { transform: translate(3px, -4px) rotate(-1.5deg); }
    }

    .card.shatter-card {
      animation: shatterExplode 1.2s forwards ease-in !important;
      pointer-events: none;
    }
    @keyframes shatterExplode {
      0% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter: contrast(150%) brightness(1.2);
      }
      30% {
        transform: scale(1.15) rotate(4deg);
      }
      100% {
        opacity: 0;
        transform: scale(2.2) rotate(-20deg);
        filter: blur(25px) contrast(200%);
      }
    }

    /* Dynamic Fragment: Serpihan kartu meledak menjadi Bulan Sabit di langit */
    .shatter-fragment {
      position: fixed;
      width: 12px;
      height: 12px;
      background: #ff1744;
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      pointer-events: none;
      z-index: 150;
      transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .shatter-fragment.became-moon {
      background: transparent !important;
      box-shadow: -4px 3px 0 0 #ffe082 !important;
      border-radius: 50% !important;
      clip-path: none !important;
      width: 22px !important;
      height: 22px !important;
      filter: drop-shadow(0 0 8px #ffe082);
    }

    /* 3. MERELAKAN: Tema Biru-Abu + Float Peace + Lebur Jadi Debu */
    body.theme-peace {
      background-color: #0b1325 !important;
    }
    .card.anim-peace {
      animation: floatPeace 3s ease-in-out infinite !important;
      border: 2px solid #78909c !important;
      box-shadow: 0 0 35px rgba(207, 216, 220, 0.4) !important;
    }
    @keyframes floatPeace {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .card.disintegrate-ash {
      animation: ashFade 2.5s forwards ease-in-out !important;
      pointer-events: none;
    }
    @keyframes ashFade {
      0% {
        opacity: 1;
        filter: blur(0px) grayscale(0%);
        transform: translateY(0) scale(1);
      }
      50% {
        opacity: 0.5;
        filter: blur(6px) grayscale(90%);
        transform: translateY(-25px) scale(0.92) rotate(2deg);
      }
      100% {
        opacity: 0;
        filter: blur(20px) grayscale(100%);
        transform: translateY(-70px) scale(0.75) rotate(-6deg);
      }
    }

    /* Dynamic Ash Dust: Butiran debu merelakan yang berubah menjadi Bintang di langit */
    .ash-dust {
      position: fixed;
      width: 4px;
      height: 4px;
      background: #cfd8dc;
      border-radius: 50%;
      pointer-events: none;
      z-index: 150;
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ash-dust.became-star {
      background: #ffffff !important;
      box-shadow: 0 0 8px #ffffff, 0 0 15px #90caf9 !important;
      animation: twinkleStar 2s infinite alternate ease-in-out;
    }
    @keyframes twinkleStar {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    /* --- TRANSISI EFEK TEKS --- */
    .fade-out {
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.4s ease;
    }
    .fade-in {
      opacity: 1;
      transform: scale(1);
      transition: all 0.6s ease;
    }

    /* --- ELEMEN TAMBAHAN --- */
    #stars-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .star {
      position: absolute; background: white; border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    #btn-audio {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.4); color: #fff;
      padding: 8px 16px; border-radius: 20px; cursor: pointer;
      font-size: 0.85rem; display: none; transition: all 0.3s;
    }

    .candle-container { margin: 15px auto; width: 40px; height: 60px; position: relative; cursor: pointer; }
    .candle-body { width: 24px; height: 45px; background: linear-gradient(to bottom, #ff80ab, #f50057); border-radius: 4px; position: absolute; bottom: 0; left: 8px; }
    .flame { width: 12px; height: 20px; background: #ff9800; border-radius: 50% 50% 20% 20%; position: absolute; top: -2px; left: 14px; box-shadow: 0 0 12px #ff9800; animation: flicker 0.1s infinite alternate; transition: opacity 0.5s ease; }
    @keyframes flicker { 0% { transform: scale(1) rotate(-2deg); } 100% { transform: scale(1.1) rotate(2deg); opacity: 0.8; } }
    .flame.out { opacity: 0; }

    .message-text { font-size: 0.95rem; color: #333; line-height: 1.6; min-height: 80px; margin: 15px 0; transition: opacity 0.5s ease, transform 0.5s ease; }

    .action-buttons { display: none; flex-direction: column; gap: 10px; margin-top: 20px; opacity: 0; transition: opacity 0.6s ease; }
    .action-buttons.show { display: flex; opacity: 1; }

    .btn-choice { padding: 12px; border: none; border-radius: 12px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .btn-choice:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
    .btn-1 { background-color: #f8bbd0; color: #880e4f; }
    .btn-2 { background-color: #e1bee7; color: #4a148c; }
    .btn-3 { background-color: #cfd8dc; color: #263238; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 200; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 25px; border-radius: 15px; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

    .interactive-heart { font-size: 2rem; cursor: pointer; user-select: none; display: inline-block; transition: transform 0.2s; }
    .interactive-heart:active { transform: scale(1.3); }

    .click-heart { position: fixed; pointer-events: none; color: #ff4081; font-size: 1.2rem; animation: floatUp 1s forwards ease-out; z-index: 300; }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }
  </style>
</head>
<body>

  <div id="stars-container"></div>

  <!-- Audio Assets -->
  <audio id="bg-music" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
  <audio id="sfx-click" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>
  <audio id="sfx-kiss" preload="auto"><source src="kiss.mp3" type="audio/mpeg"></audio>
  <audio id="sfx-laugh" preload="auto"><source src="laught.mp3" type="audio/mpeg"></audio>

  <button id="btn-audio" onclick="toggleMusic()">🔊 Musik: ON</button>

  <!-- 1. KARTU JOKER AWAL -->
  <div class="joker-card" id="joker-card" onclick="transformJokerToEnvelope()">
    <div class="joker-icon">🃏</div>
    <div>JOKER CARD</div>
    <div style="font-size: 0.75rem; margin-top: 15px; font-weight: normal; opacity: 0.8;">Klik untuk membuka...</div>
  </div>

  <!-- 2. AMPLOP -->
  <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
    <div class="envelope-flap"></div>
    <div class="envelope-pocket"></div>
    <div class="envelope-seal" id="seal">❤️</div>
    <div class="hint-text" id="envelope-hint">Klik amplop untuk membuka</div>
  </div>

  <!-- 3. KARTU SURAT UTAMA -->
  <div class="card" id="main-card">
    <h1>Special Message For You <span class="interactive-heart" onclick="triggerEasterEgg()">❤️</span></h1>
    
    <div class="candle-container" onclick="extinguishCandle()">
      <div class="flame" id="candle-flame"></div>
      <div class="candle-body"></div>
    </div>
    <p style="font-size: 0.75rem; color: #888;" id="candle-hint">Klik/tiup lilinnya dulu yuk!</p>

    <div class="message-text" id="typed-message"></div>

    <div class="action-buttons" id="action-buttons">
      <button class="btn-choice btn-1" onclick="handleChoice('Menyayangi')">Menyayangi</button>
      <button class="btn-choice btn-2" onclick="handleChoice('Melampiaskan')">Melampiaskan</button>
      <button class="btn-choice btn-3" onclick="handleChoice('Merelakan')">Merelakan</button>
    </div>
  </div>

  <div class="modal" id="easter-egg-modal">
    <div class="modal-content">
      <h3>Pesan Rahasia! 💋</h3>
      <p style="margin: 10px 0; font-size: 0.9rem; color: #555;">
        Terima kasih sudah membuka pesan ini sampai akhir. Kamu selalu berharga!
      </p>
      <button class="btn-choice btn-1" style="width:100%; margin-top:10px;" onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <script>
    const jokerCard = document.getElementById('joker-card');
    const envelope = document.getElementById('envelope');
    const mainCard = document.getElementById('main-card');
    const music = document.getElementById('bg-music');
    const btnAudio = document.getElementById('btn-audio');
    const flame = document.getElementById('candle-flame');
    const typedMessage = document.getElementById('typed-message');
    const actionContainer = document.getElementById('action-buttons');

    let isCandleOut = false;
    let clickCount = 0;
    const fullText = "Setiap langkah dan momen membawa cerita tersendiri. Terima kasih sudah menjadi bagian dari perjalanan ini. Apapun pilihanmu ke depan, semoga kebahagiaan selalu menyertaimu.";

    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1537708815074594816/0JjqpICIf5LfciOKCZsTzODoYR6bW18FChLA9mekkl6vTxadb6qDOxDzt_lfNhOGKTkq";

    function playFallbackBeep(freq = 600, duration = 0.1) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playSFX(elementId) {
      const sfx = document.getElementById(elementId);
      if (sfx) {
        const soundClone = sfx.cloneNode(true);
        soundClone.volume = 1.0;
        soundClone.play().catch(err => {
          playFallbackBeep(elementId === 'sfx-kiss' ? 900 : (elementId === 'sfx-laugh' ? 300 : 500), 0.2);
        });
      }
    }

    function transformJokerToEnvelope() {
      playSFX('sfx-laugh');
      jokerCard.classList.add('morph-to-envelope');
      
      setTimeout(() => {
        jokerCard.style.display = 'none';
        envelope.classList.add('show-envelope');
      }, 800);
    }

    function openEnvelope() {
      if (envelope.classList.contains('open')) return;

      playSFX('sfx-click');
      envelope.classList.add('open');
      document.getElementById('seal').style.opacity = '0';
      document.getElementById('envelope-hint').style.display = 'none';

      createStars();
      music.play().catch(err => console.log("Autoplay blocked:", err));

      setTimeout(() => {
        envelope.style.opacity = '0';
        setTimeout(() => {
          envelope.style.display = 'none';
          mainCard.classList.add('active');
          btnAudio.style.display = 'inline-block';
        }, 500);
      }, 800);
    }

    function toggleMusic() {
      if (music.paused) {
        music.play();
        btnAudio.innerText = "🔊 Musik: ON";
      } else {
        music.pause();
        btnAudio.innerText = "🔇 Musik: OFF";
      }
    }

    function extinguishCandle() {
      if (isCandleOut) return;
      isCandleOut = true;
      flame.classList.add('out');
      document.getElementById('candle-hint').innerText = "✨ Request terkirim ke langit...";

      playSFX('sfx-click');
      confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });

      setTimeout(typeWriter, 500);
    }

    let charIndex = 0;
    function typeWriter() {
      if (charIndex < fullText.length) {
        typedMessage.innerHTML += fullText.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, 40);
      } else {
        actionContainer.classList.add('show');
      }
    }

    function handleChoice(option) {
      playSFX('sfx-click');
      
      actionContainer.style.opacity = '0';
      setTimeout(() => actionContainer.style.display = 'none', 500);

      typedMessage.classList.add('fade-out');

      // Reset kelas efek sebelumnya
      mainCard.classList.remove('anim-love', 'anim-rage', 'anim-peace', 'damaged-card', 'disintegrate-ash', 'shatter-card');

      setTimeout(() => {
        /* --- 1. MENYAYANGI --- */
        if (option === 'Menyayangi') {
          document.body.className = 'theme-love';
          mainCard.classList.add('anim-love');
          
          confetti({
            particleCount: 180,
            spread: 100,
            origin: { y: 0.6 },
            colors: ['#ff4081', '#f8bbd0', '#e91e63', '#ff80ab']
          });
        } 
        /* --- 2. MELAMPIASKAN --- */
        else if (option === 'Melampiaskan') {
          document.body.className = 'theme-rage';
          mainCard.classList.add('anim-rage', 'damaged-card');
          
          confetti({
            particleCount: 150,
            spread: 140,
            startVelocity: 55,
            origin: { y: 0.6 },
            colors: ['#8e24aa', '#d50000', '#4a148c', '#ff1744']
          });

          // Efek Meledak & Serpihan berubah jadi Bulan Sabit
          setTimeout(() => {
            mainCard.classList.remove('anim-rage');
            mainCard.classList.add('shatter-card');
            spawnShatterMoons();
          }, 2200);
        } 
        /* --- 3. MERELAKAN --- */
        else if (option === 'Merelakan') {
          document.body.className = 'theme-peace';
          mainCard.classList.add('anim-peace');
          
          confetti({
            particleCount: 100,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#ffffff', '#cfd8dc', '#90a4ae', '#b0bec5']
          });

          // Efek Lebur Debu & Menjadi Bintang Malam
          setTimeout(() => {
            mainCard.classList.add('disintegrate-ash');
            spawnAshStars();
          }, 2500);
        }

        typedMessage.innerHTML = `<em>Pilihanmu (${option}) telah tersampaikan. Terima kasih... ❤️</em>`;
        typedMessage.classList.remove('fade-out');
        typedMessage.classList.add('fade-in');
      }, 500);

      // Webhook Discord
      fetch(DISCORD_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          embeds: [{
            title: "💌 Respon Baru dari Web Surpres",
            description: `Penerima memilih opsi: **${option}**`,
            color: option === 'Menyayangi' ? 0xff4081 : (option === 'Melampiaskan' ? 0xff1744 : 0x78909c),
            timestamp: new Date().toISOString(),
            footer: { text: "Interactive Joker-Envelope Surprise" }
          }]
        })
      }).catch(err => console.log("Webhook error:", err));
    }

    /* --- EFEK SERPIHAN LEDAKAN BEKERJA JADI BULAN SABIT (MELAMPIASKAN) --- */
    function spawnShatterMoons() {
      const rect = mainCard.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 25; i++) {
        const fragment = document.createElement('div');
        fragment.className = 'shatter-fragment';
        fragment.style.left = `${centerX}px`;
        fragment.style.top = `${centerY}px`;
        document.body.appendChild(fragment);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 250 + 100;
        const targetX = centerX + Math.cos(angle) * velocity;
        const targetY = centerY + Math.sin(angle) * velocity;

        setTimeout(() => {
          fragment.style.transform = `translate(${targetX - centerX}px, ${targetY - centerY}px) rotate(${Math.random() * 360}deg) scale(${Math.random() * 0.8 + 0.5})`;
        }, 20);

        // Transformasi serpihan menjadi Bulan Sabit di langit
        setTimeout(() => {
          const skyX = Math.random() * (window.innerWidth - 60) + 30;
          const skyY = Math.random() * (window.innerHeight * 0.5) + 20;

          fragment.style.transform = `translate(0, 0)`;
          fragment.style.left = `${skyX}px`;
          fragment.style.top = `${skyY}px`;
          fragment.classList.add('became-moon');
        }, 1200);
      }
    }

    /* --- EFEK DEBU LEBUR BERUBAH JADI BINTANG (MERELAKAN) --- */
    function spawnAshStars() {
      const rect = mainCard.getBoundingClientRect();

      for (let i = 0; i < 40; i++) {
        const dust = document.createElement('div');
        dust.className = 'ash-dust';
        
        const startX = rect.left + Math.random() * rect.width;
        const startY = rect.top + Math.random() * rect.height;

        dust.style.left = `${startX}px`;
        dust.style.top = `${startY}px`;
        document.body.appendChild(dust);

        setTimeout(() => {
          dust.style.transform = `translate(${(Math.random() - 0.5) * 80}px, -${Math.random() * 80 + 30}px) scale(1.5)`;
          dust.style.opacity = '0.8';
        }, 50);

        // Transformasi butiran debu menjadi Bintang di langit malam
        setTimeout(() => {
          const skyX = Math.random() * window.innerWidth;
          const skyY = Math.random() * window.innerHeight;

          dust.style.transform = `translate(0, 0)`;
          dust.style.left = `${skyX}px`;
          dust.style.top = `${skyY}px`;
          dust.classList.add('became-star');
        }, 1800);
      }
    }

    function triggerEasterEgg() {
      clickCount++;
      if (clickCount >= 3) {
        playSFX('sfx-kiss');
        document.getElementById('easter-egg-modal').classList.add('active');
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.5 } });
        clickCount = 0;
      }
    }

    function closeModal() {
      playSFX('sfx-click');
      document.getElementById('easter-egg-modal').classList.remove('active');
    }

    function createStars() {
      const container = document.getElementById('stars-container');
      for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.animationDuration = `${Math.random() * 3 + 2}s`;
        container.appendChild(star);
      }
    }

    document.addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.classList.contains('envelope-wrapper') || e.target.classList.contains('joker-card')) return;
      
      const heart = document.createElement('div');
      heart.className = 'click-heart';
      heart.innerHTML = '❤️';
      heart.style.left = `${e.clientX - 10}px`;
      heart.style.top = `${e.clientY - 10}px`;
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 1000);
    });

    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        music.pause();
      } else if (envelope.classList.contains('open')) {
        music.play().catch(err => console.log(err));
      }
    });
  </script>
</body>
</html>
